# VETO demo defaults. Paths are relative to the host's isolated workspace.
version: "veto-policy-v1"
allowed_kinds: ["command", "file"]
allowed_executables: ["ls", "cat", "sed", "touch", "rm", "npm", "node", "view_file", "list_dir", "find_by_name", "grep_search", "write_to_file", "replace_file_content", "multi_replace_file_content"]
protected_paths: [".git", ".env", ".agents", "protected", "sandbox"]
max_actions_per_run: 100
max_replans_without_progress: 2
repeat_without_progress_limit: 2
repetition_probability_threshold: 0.7
low_progress_max: 0.35
minimum_choice_margin: 0.15
manual_review_categories: ["network", "delete"]
# Trust the host to prove these named tools are read-only; VETO still checks paths,
# repetition, and goal alignment. Disable if the host cannot enforce that mapping.
allow_host_validated_read_only_actions: true
